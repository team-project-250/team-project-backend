# Render deployment blueprint — https://render.com/docs/blueprint-spec
databases:
  - name: easyrent-db
    plan: free

services:
  - type: web
    name: team-project-backend
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/schema/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: easyrent-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false  # set to the Render service host, e.g. team-project-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # set to https://<the Render service host>
      - key: CORS_ORIGINS
        sync: false  # set to the deployed frontend URL
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false  # S3-compatible bucket for uploaded media — see README
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false  # only for non-AWS providers, e.g. Cloudflare R2
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false  # public host for media URLs (bucket public domain / CDN)
      - key: NUM_PROXIES
        sync: false  # proxies in front of gunicorn (X-Forwarded-For hops) — used by rate limiting
